[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "malvisor"
version = "0.1.0"
description = "Static, evidence-first PE analysis foundation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10", "jsonschema>=4.20,<5"]

[project.scripts]
malvisor = "malvisor.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

